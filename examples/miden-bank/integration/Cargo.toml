[package]
name = "integration"
version = "0.1.0"
edition.workspace = true

[dependencies]
miden-client = { version = "0.16", features = ["tonic"] }
miden-client-sqlite-store = { version = "0.16", package = "miden-client-sqlite-store" }
miden-standards = { version = "0.16", features = ["testing"] }
miden-testing = "0.16"
miden-protocol = "0.16"
tokio = { version = "1.48", features = ["rt-multi-thread", "net", "macros", "fs"] }
rand = { version = "0.10" }
anyhow = "1.0"
