[toolchain]
channel = "nightly-2025-12-10"
components = ["rustfmt", "rust-src", "clippy"]
# Note: do NOT add wasm32-wasip2 to targets here.
# cargo-miden uses -Z build-std to compile core from source, which conflicts
# with a pre-installed wasm32-wasip2 target (duplicate lang item error).
# cargo-miden will install the target itself if needed.
profile = "minimal"